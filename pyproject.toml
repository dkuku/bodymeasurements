[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bodymeasurements"
version = "0.3.0"
description = "Pure anthropometric body-composition platform for Home Assistant: volume, density, bone correction, and muscle-to-fat ratios from tape measurements and weight"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = ["homeassistant>=2026.3.0"]

[project.optional-dependencies]
dev = [
    "pytest-cov",
    "pytest-homeassistant-custom-component",
    "ruff==0.15.20",
]

[tool.setuptools.packages.find]
include = ["custom_components*"]
exclude = ["tests*"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "D", "SIM", "C4", "PGH", "RUF", "BLE"]
ignore = ["E501", "D202", "D107", "RUF002", "UP024"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-rxf -v -l --tb=short"

[tool.coverage.run]
source = ["custom_components"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
skip_covered = true
show_missing = true
