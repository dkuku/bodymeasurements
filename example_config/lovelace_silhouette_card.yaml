# example_config/lovelace_silhouette_card.yaml
#
# Interactive Picture Elements card for Home Assistant Dashboard.
#
# Note: The silhouette image is automatically served by the integration at:
#   /bodymeasurements_static/body_silhouette.jpg
# (You can also place it in /config/www/body_silhouette.jpg and use /local/body_silhouette.jpg)

type: picture-elements
image: /bodymeasurements_static/body_silhouette.jpg
elements:
  # Waga (Weight)
  - type: state-label
    entity: input_number.body_weight
    prefix: "Waga: "
    suffix: " kg"
    tap_action:
      action: more-info
    style:
      top: 8%
      left: 20%
      transform: translate(-50%, -50%)
      background: rgba(15, 23, 42, 0.9)
      color: "#a78bfa"
      border: 1px solid rgba(167, 139, 250, 0.5)
      border-radius: 12px
      padding: 4px 10px
      font-size: 13px
      font-weight: bold

  # Szyja (Neck)
  - type: state-label
    entity: input_number.body_neck
    prefix: "Szyja: "
    suffix: " cm"
    tap_action:
      action: more-info
    style:
      top: 19%
      left: 50%
      transform: translate(-50%, -50%)
      background: rgba(15, 23, 42, 0.85)
      color: "#38bdf8"
      border: 1px solid rgba(56, 189, 248, 0.4)
      border-radius: 12px
      padding: 3px 8px
      font-size: 12px
      font-weight: 600

  # Klatka piersiowa (Chest)
